spring.application.name=compairator
spring.main.web-application-type=servlet
server.port=8080


spring.datasource.url=jdbc:mysql://localhost:3306/compairator?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

ai.providers.groq.api-key=${GROQ_API_KEY}
ai.providers.groq.base-url=https://api.groq.com/openai/v1
ai.providers.groq.model=openai/gpt-oss-20b
ai.providers.groq.endpoint=/chat/completions

ai.providers.mistral.api-key=${MISTRAL_API_KEY}
ai.providers.mistral.base-url=https://api.mistral.ai/v1
ai.providers.mistral.model=ministral-3b-2512
ai.providers.mistral.endpoint=/chat/completions

spring.jackson.mapper.accept-case-insensitive-enums=true

spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Optional USD rates per million tokens. No rate means unknown cost, never a zero estimate.
# The pricing model must match the model returned by the provider.
# ai.pricing.groq.model=openai/gpt-oss-20b
# ai.pricing.groq.input-per-million=...
# ai.pricing.groq.output-per-million=...
# ai.pricing.mistral.model=ministral-3b-2512
# ai.pricing.mistral.input-per-million=...
# ai.pricing.mistral.output-per-million=...
