# Separate schema: tests clear their data and must never target the application's schema.
spring.datasource.url=jdbc:mysql://localhost:3306/compairator_kpi_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_TEST_USERNAME:${DB_USERNAME}}
spring.datasource.password=${MYSQL_TEST_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=create-drop
